<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Dashboard – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="dash-header">
    <div class="logo-row">
      <img src="assets/logo.jpg" alt="Lonely Fans" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </div>
    <div>
      <span id="userInfo"></span>
      <button onclick="LonelyFansAuth.logout()" style="width:auto; margin-left:1rem;">Logout</button>
    </div>
  </header>
  <main class="container">
    <h1>Welcome</h1>
    <div id="roleContent"></div>
  </main>
  <script src="auth.js"></script>
  <script>
    const session = LonelyFansAuth.getSession();
    if (!session) {
      window.location.href = 'login.html';
    }
    if (!session.ageVerified) {
      window.location.href = 'age-verify.html';
    }

    document.getElementById('userInfo').textContent = `${session.email} (${session.role})`;

    // Daily streak
    const streak = LonelyFansAuth.claimDailyStreak(session.id);
    if (streak.claimed) {
      document.getElementById('roleContent').insertAdjacentHTML('beforebegin',
        `<div class="message success">Daily streak claimed! Day ${streak.streak} — +10 SparkCoins</div>`);
    }

    const content = document.getElementById('roleContent');
    if (session.role === 'creator') {
      content.innerHTML = `
        <h2>Creator Dashboard</h2>
        <p class="note">Manage your page, go live, and track earnings.</p>
        <div style="display:grid; gap:0.6rem; margin-top:1.25rem;">
          <a href="customize.html" class="btn">Customize Your Page</a>
          <a href="tiers.html" class="btn secondary">Manage Subscription Tiers</a>
          <a href="live.html?id=${session.id}" class="btn">Go Live</a>
          <a href="earnings.html" class="btn secondary">Earnings & Payouts</a>
          <a href="attest.html" class="btn secondary">2257 Attestation</a>
          <a href="report.html" class="btn secondary">Report Content</a>
        </div>
      `;
    } else {
      content.innerHTML = `
        <h2>Fan Dashboard</h2>
        <p class="note">Browse creators and manage your SparkCoins.</p>
        <div style="display:grid; gap:0.6rem; margin-top:1.25rem;">
          <a href="browse.html" class="btn">Browse Creators</a>
          <a href="wallet.html" class="btn">Open SparkCoins Wallet</a>
          <a href="report.html" class="btn secondary">Report Content</a>
        </div>
      `;
    }
          <li>SparkCoins wallet (Phase 3) ✅</li>
          <li>Subscriptions (Phase 4)</li>
          <li>Live rooms (Phase 5)</li>
        </ul>
      `;
    }
  </script>
</body>
</html>
