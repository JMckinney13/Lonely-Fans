<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Creators – Lonely Fans</title>
  <meta name="description" content="Discover creators on Lonely Fans. Subscribe with SparkCoins and join live streams.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .creator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .creator-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
    .creator-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .creator-card .banner { height: 90px; background: #1a1520; }
    .creator-card .info { padding: 0.9rem; }
    .creator-card h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
    .search-box { margin: 1rem 0; }
    .search-box input { max-width: 320px; }
  </style>
</head>
<body>
  <header class="dash-header">
    <div class="logo-row">
      <img src="assets/logo.jpg" alt="Lonely Fans" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </div>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <button onclick="LonelyFansAuth.logout()" style="width:auto; margin-left:1rem;">Logout</button>
    </div>
  </header>
  <main class="container wide">
    <h1>Browse Creators</h1>
    <div class="search-box">
      <input type="search" id="search" placeholder="Search creators..." oninput="renderGrid()">
    </div>
    <div id="grid" class="creator-grid"></div>
  </main>
  <script src="auth.js"></script>
  <script>
    const session = LonelyFansAuth.getSession();
    if (!session) location.href = 'login.html';

    const users = LonelyFansAuth.getUsers() || [];
    const creators = users.filter(u => u.role === 'creator');
    const grid = document.getElementById('grid');

    function renderGrid() {
      const q = document.getElementById('search').value.toLowerCase();
      const filtered = creators.filter(c => {
        const profile = LonelyFansAuth.getProfile(c.id) || {};
        const name = (profile.displayName || c.email || '').toLowerCase();
        return name.includes(q);
      });

      if (filtered.length === 0) {
        grid.innerHTML = '<div class="empty-state">No creators match your search.<br><a href="register.html" class="btn" style="width:auto;margin-top:1rem">Become a Creator</a></div>';
        return;
      }

      grid.innerHTML = filtered.map(c => {
        const profile = LonelyFansAuth.getProfile(c.id) || {};
        const live = LonelyFansAuth.isLive(c.id);
        return `
          <div class="creator-card">
            <div class="banner" style="background:${profile.themeColor || '#ff6b6b'}"></div>
            <div class="info">
              <h3>${profile.displayName || c.email.split('@')[0]}</h3>
              <p class="note">${(profile.bio || 'No bio').slice(0, 70)}${(profile.bio || '').length > 70 ? '…' : ''}</p>
              ${live ? '<span style="color:#ff6b6b;font-size:0.8rem;font-weight:600">● LIVE</span>' : ''}
              <p style="margin-top:0.6rem"><a href="creator.html?id=${c.id}" class="btn" style="width:auto;padding:0.5rem 1rem">View Page</a></p>
            </div>
          </div>
        `;
      }).join('');
    }

    renderGrid();
  </script>
</body>
</html>
