<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Browse Creators – Lonely Fans</title>
  <meta name="description" content="Discover creators on Lonely Fans. Subscribe with SparkCoins and join live streams.">
  <link rel="stylesheet" href="styles.css">
  <style>
    .creator-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 1rem; margin-top: 1rem; }
    .creator-card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; overflow: hidden; transition: transform 0.15s, box-shadow 0.15s; }
    .creator-card:hover { transform: translateY(-2px); box-shadow: 0 8px 24px rgba(0,0,0,0.25); }
    .creator-card .banner { height: 90px; background: #1a1520; }
    .creator-card .info { padding: 0.9rem; }
    .creator-card h3 { margin: 0 0 0.3rem; font-size: 1.05rem; }
    .search-box { margin: 1rem 0; }
    .search-box input { max-width: 320px; }
    .creator-card .banner { display: flex; align-items: center; justify-content: center; margin: 0; border-radius: 0; }
    .avatar { width: 48px; height: 48px; border-radius: 50%; background: #0e121c; display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 1.2rem; color: var(--accent-soft); }
    .live-dot { color: #ff6b6b; font-size: 0.75rem; font-weight: 600; margin-left: 0.3rem; }
    .card-actions { display: flex; gap: 0.5rem; margin-top: 0.6rem; }
  </style>
</head>
<body>
  <header class="dash-header">
    <a href="index.html" class="logo-row">
      <img src="assets/logo.jpg" alt="" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </a>
    <nav class="header-nav">
      <a href="dashboard.html">Dashboard</a>
      <button type="button" class="secondary" onclick="LonelyFansAuth.logout()">Logout</button>
    </nav>
  </header>
  <main class="container wide">
    <h1>Browse Creators</h1>
    <div class="search-box">
      <input type="search" id="search" placeholder="Search creators..." oninput="renderGrid()">
    </div>
    <div id="grid" class="creator-grid"></div>
  </main>
  <script src="auth.js"></script>
  <script>
    const session = LonelyFansAuth.requireSession();
    const esc = LonelyFansAuth.escapeHtml;
    const grid = document.getElementById('grid');
    let creators = [];

    function renderGrid() {
      const q = document.getElementById('search').value.trim().toLowerCase();
      const filtered = creators.filter(c => c.displayName.toLowerCase().includes(q) || c.bio.toLowerCase().includes(q));

      if (filtered.length === 0) {
        grid.innerHTML = creators.length
          ? '<div class="empty-state" style="grid-column:1/-1">No creators match your search.</div>'
          : '<div class="empty-state" style="grid-column:1/-1">No creators yet.</div>';
        return;
      }

      grid.innerHTML = filtered.map(c => `
          <div class="creator-card">
            <div class="banner" style="background:${/^#[0-9a-f]{3,8}$/i.test(c.themeColor) ? c.themeColor : '#ff6b6b'}">
              <div class="avatar">${esc((c.displayName || '?')[0].toUpperCase())}</div>
            </div>
            <div class="info">
              <h3>${esc(c.displayName)} ${c.isLive ? '<span class="live-dot">● LIVE</span>' : ''}</h3>
              <p class="note">${esc(c.bio.slice(0, 70) || 'No bio')}${c.bio.length > 70 ? '…' : ''}</p>
              <div class="card-actions">
                <a href="creator.html?id=${encodeURIComponent(c.id)}" class="btn small">View Page</a>
                ${c.isLive ? `<a href="live.html?id=${encodeURIComponent(c.id)}" class="btn small secondary">Watch</a>` : ''}
              </div>
            </div>
          </div>
        `).join('');
    }

    if (session) {
      grid.innerHTML = '<div class="empty-state" style="grid-column:1/-1">Loading creators…</div>';
      LonelyFansAuth.getCreators()
        .then(list => { creators = list; renderGrid(); })
        .catch(err => {
          grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">Couldn't load creators: ${esc(err.message)}</div>`;
        });
    }
  </script>
</body>
</html>
