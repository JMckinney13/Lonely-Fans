<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Register – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <div class="container">
    <h1>Create Account</h1>
    <form id="registerForm">
      <label>Email</label>
      <input type="email" id="email" required>
      
      <label>Password</label>
      <input type="password" id="password" required minlength="6">
      
      <label>I want to join as</label>
      <select id="role" required>
        <option value="viewer">Viewer / Fan</option>
        <option value="creator">Creator</option>
      </select>
      
      <button type="submit">Register</button>
    </form>
    <p>Already have an account? <a href="login.html">Log in</a></p>
    <p id="message" class="message"></p>
  </div>
  <script src="auth.js"></script>
  <script>
    document.getElementById('registerForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const email = document.getElementById('email').value;
      const password = document.getElementById('password').value;
      const role = document.getElementById('role').value;
      try {
        await LonelyFansAuth.register(email, password, role);
        document.getElementById('message').textContent = 'Account created! Redirecting to age verification...';
        setTimeout(() => window.location.href = 'age-verify.html', 800);
      } catch (err) {
        document.getElementById('message').textContent = err.message;
      }
    });
  </script>
</body>
</html>
