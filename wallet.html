<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>SparkCoins Wallet – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="dash-header">
    <a href="index.html" class="logo-row">
      <img src="assets/logo.jpg" alt="" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </a>
    <nav class="header-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="subscriptions.html">My Subscriptions</a>
      <button type="button" class="secondary" onclick="LonelyFansAuth.logout()">Logout</button>
    </nav>
  </header>
  <main class="container">
    <h1>SparkCoins Wallet</h1>
    <div class="balance-card">
      <div class="balance-label">Current Balance</div>
      <div class="balance-amount" id="balance">0</div>
      <div class="balance-unit">SparkCoins</div>
    </div>

    <h2>Buy SparkCoins</h2>
    <p class="note">Prototype purchases are simulated. No real payment is processed.</p>
    <p id="txMessage" class="message" role="status"></p>
    <div class="packs">
      <button class="pack" onclick="buyPack(100, 9.99)">100 SparkCoins<br><small>$9.99</small></button>
      <button class="pack" onclick="buyPack(500, 39.99)">500 SparkCoins<br><small>$39.99</small></button>
      <button class="pack" onclick="buyPack(1200, 79.99)">1,200 SparkCoins<br><small>$79.99</small></button>
      <button class="pack" onclick="buyPack(3000, 149.99)">3,000 SparkCoins<br><small>$149.99</small></button>
    </div>

    <h2>Recent Transactions</h2>
        <div id="transactions" class="tx-list"></div>
  </main>
  <script src="auth.js"></script>
  <script>
    const session = LonelyFansAuth.requireSession();
    const esc = LonelyFansAuth.escapeHtml;

    async function refresh() {
      const list = document.getElementById('transactions');
      const [balance, txs] = await Promise.all([
        LonelyFansAuth.getBalance(session.id),
        LonelyFansAuth.getUserTransactions(session.id)
      ]);
      document.getElementById('balance').textContent = Number(balance || 0).toLocaleString();
      if (!txs.length) {
        list.innerHTML = '<div class="empty-state">No transactions yet.</div>';
        return;
      }
      list.innerHTML = txs.slice(0, 15).map(tx => {
        const isPositive = tx.amount > 0;
        const d = LonelyFansAuth.parseServerDate(tx.timestamp);
        return `
          <div class="tx">
            <div class="desc">
              <div>${esc(tx.description || 'Transaction')}</div>
              ${d ? `<div class="meta">${d.toLocaleString([], { dateStyle: 'medium', timeStyle: 'short' })}</div>` : ''}
            </div>
            <div class="amount ${isPositive ? 'positive' : 'negative'}">${isPositive ? '+' : ''}${tx.amount.toLocaleString()}</div>
          </div>
        `;
      }).join('');
    }

    async function buyPack(amount, price) {
      const msg = document.getElementById('txMessage');
      const packs = document.querySelectorAll('.pack');
      packs.forEach(p => p.disabled = true);
      msg.className = 'message';
      msg.textContent = 'Processing…';
      try {
        await LonelyFansAuth.buyCoins(amount, price);
        await refresh();
        msg.className = 'message success';
        msg.textContent = `Added ${amount.toLocaleString()} SparkCoins to your wallet.`;
      } catch (err) {
        msg.className = 'message';
        msg.textContent = err.message;
      } finally {
        packs.forEach(p => p.disabled = false);
      }
    }

    if (session) {
      document.getElementById('balance').textContent = '…';
      document.getElementById('transactions').innerHTML = '<div class="empty-state">Loading…</div>';
      refresh().catch(err => {
        document.getElementById('transactions').innerHTML = `<div class="empty-state">Couldn't load wallet: ${esc(err.message)}</div>`;
      });
    }
  </script>
</body>
</html>
