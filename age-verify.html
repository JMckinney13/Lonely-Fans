<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Age Verification – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css?v=32520447">
</head>
<body>
  <div class="container">
    <h1>Age Verification</h1>
    <p>To access Lonely Fans you must verify that you are 18 or older.</p>
    <p class="note">Prototype mode: In production this will use a real provider (Yoti, Veriff, VerifyMy, etc.) with ID scan or facial age estimation.</p>
    
    <div id="verifyOptions" class="button-stack">
      <button onclick="simulateVerify('id')">Simulate Government ID Check</button>
      <button onclick="simulateVerify('facial')">Simulate Facial Age Estimation</button>
    </div>
    
    <p id="status" class="message" role="status"></p>
    <p><a href="login.html">Back to login</a></p>
  </div>
  <script src="auth.js?v=3ad7d4a1"></script>
  <script>
    const session = LonelyFansAuth.requireSession({ verified: false });

    async function simulateVerify(method) {
      const status = document.getElementById('status');
      const buttons = document.querySelectorAll('#verifyOptions button');
      buttons.forEach(b => b.disabled = true);
      status.className = 'message';
      status.textContent = `Verifying via ${method === 'id' ? 'government ID' : 'facial age estimation'}… (simulated)`;
      await new Promise(r => setTimeout(r, 1200));
      try {
        await LonelyFansAuth.markAgeVerified(session.id);
        status.className = 'message success';
        status.textContent = 'Verified! Redirecting to dashboard...';
        setTimeout(() => window.location.href = 'dashboard.html', 600);
      } catch (err) {
        status.textContent = err.message;
        buttons.forEach(b => b.disabled = false);
      }
    }
  </script>
</body>
</html>
