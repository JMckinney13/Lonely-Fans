<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css?v=32520447">
  <style>
    .live-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1rem; max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
    @media (max-width: 800px) { 
      .live-layout { grid-template-columns: 1fr; } 
      .side-panel { height: auto; min-height: 60vh; }
      .chat-messages { min-height: 240px; }
    }
    .empty { color: var(--muted); text-align: center; padding: 1.5rem; font-size: 0.9rem; }
    .video-area { background: #000; border-radius: 12px; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; color: #666; position: relative; }
    .video-area { overflow: hidden; }
    .video-area video, .video-area canvas { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; }
    .video-area video.mirror { transform: scaleX(-1); }
    .video-area [hidden] { display: none !important; }
    .ov { position: absolute; z-index: 2; display: flex; gap: 0.4rem; align-items: center; pointer-events: none; }
    .ov-top { top: 12px; left: 12px; right: 12px; }
    .ov-bottom { left: 12px; right: 12px; bottom: 12px; flex-direction: column; align-items: stretch; gap: 0.35rem; }
    .pill { background: rgba(0,0,0,0.55); color: #fff; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 600; backdrop-filter: blur(4px); white-space: nowrap; }
    .video-area .live-badge { position: static; background: #ff3b5c; color: white; padding: 4px 10px; border-radius: 999px; font-size: 0.78rem; font-weight: 800; letter-spacing: 0.04em; }
    .video-area .live-badge::before { content: ''; display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: #fff; margin-right: 6px; vertical-align: 1px; animation: blink 1.4s infinite; }
    @keyframes blink { 50% { opacity: 0.3; } }
    .ov-spacer { flex: 1; }
    .ov-name { font-weight: 700; font-size: 1rem; color: #fff; text-shadow: 0 1px 4px rgba(0,0,0,0.8); }
    .ov-goal { background: rgba(0,0,0,0.55); border-radius: 8px; padding: 0.35rem 0.6rem; font-size: 0.75rem; color: #fff; max-width: 340px; }
    .ov-goal .progress-bar { height: 5px; margin: 0.25rem 0 0; }
    .preview-note { background: rgba(255,255,255,0.15); color: #fff; font-size: 0.7rem; padding: 3px 8px; border-radius: 6px; }
    .cam-off-cover { position: absolute; inset: 0; z-index: 1; display: flex; align-items: center; justify-content: center; background: #111; color: #aaa; font-size: 0.95rem; }
    .stage-panel { position: absolute; inset: 0; z-index: 3; display: flex; flex-direction: column; align-items: center; justify-content: center; text-align: center; padding: 1rem; background: rgba(5,7,12,0.82); color: #ddd; gap: 0.5rem; }
    .stage-panel h3 { margin: 0; color: #fff; font-size: 1.1rem; }
    .stage-panel p { margin: 0; max-width: 420px; font-size: 0.9rem; }
    .stage-panel button { width: auto; margin-top: 0.4rem; padding: 0.65rem 1.4rem; }
    .stage-panel .go-live-btn { background: #ff3b5c; font-weight: 700; }
    .cam-controls { display: flex; flex-wrap: wrap; gap: 0.5rem; align-items: center; margin-top: 0.7rem; }
    .cam-controls[hidden] { display: none; }
    .cam-controls select { width: auto; min-width: 0; flex: 1 1 160px; padding: 0.5rem; margin: 0; }
    .cam-controls button { width: auto; margin: 0; padding: 0.55rem 0.9rem; font-size: 0.85rem; }
    .cam-controls button[aria-pressed="true"] { background: #7f1d1d; }
    .cam-controls .end-btn { background: #b91c1c; font-weight: 700; }
    @media (max-width: 800px) { .ov-goal { max-width: none; } .pill { font-size: 0.72rem; padding: 3px 8px; } }
    .side-panel { background: var(--card); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; height: 70vh; }
    .goal-box { background: #1a1a22; border: 1px solid #333; border-radius: 10px; padding: 0.8rem; margin-bottom: 1rem; }
    .progress-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    .chat-messages { flex: 1; overflow-y: auto; font-size: 0.85rem; margin-bottom: 0.5rem; padding: 0.5rem; background: #0e121c; border-radius: 8px; }
    .chat-messages .msg { margin-bottom: 0.35rem; word-break: break-word; }
    .badge { display: inline-block; background: #ff6b6b; color: white; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
    .emote { font-size: 1.1rem; vertical-align: middle; }
    .chat-input { display: flex; gap: 0.4rem; align-items: center; }
    .chat-input input { flex: 1; }
    .chat-input button, .inline-form button { width: auto; margin: 0; padding: 0.6rem 0.9rem; }
    .chat-input input, .inline-form input { padding: 0.6rem 0.75rem; min-width: 0; }
    .emoji-btn, .chat-input .emoji-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.3rem; }
    .emoji-btn:hover { background: transparent; }
    .emoji-picker { background: #1a1f2e; padding: 0.4rem; border-radius: 8px; margin-top: 0.3rem; display: flex; gap: 0.2rem; flex-wrap: wrap; }
    .emoji-picker[hidden] { display: none; }
    .emoji-picker button { width: auto; margin: 0; background: transparent; font-size: 1.2rem; padding: 0.25rem 0.4rem; }
    .emoji-picker button:hover { background: #2a3142; }
    .inline-form { display: flex; gap: 0.4rem; align-items: center; margin-top: 0.5rem; }
    .inline-form input { flex: 1; }
    .inline-form .emoji-input { flex: 0 0 70px; }
    .goal-form input { margin-top: 0.4rem; padding: 0.6rem 0.75rem; }
    .goal-form button { margin-top: 0.6rem; padding: 0.6rem; }
    .goal-box .message { margin: 0.4rem 0 0; font-size: 0.85rem; }
    .goal-box .positive { color: var(--success); }
    .small-btn { width: auto; margin-top: 0.6rem; padding: 0.4rem 0.8rem; font-size: 0.85rem; }
    .creator-controls { margin-top: 1rem; background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 1rem; }
    .creator-controls[hidden] { display: none; }
    .creator-controls h3 { font-size: 1rem; margin: 0.8rem 0 0; }
    .creator-controls h3:first-child { margin-top: 0; }
    .check-label { display: flex; align-items: center; gap: 0.5rem; color: var(--text); margin-top: 1rem; }
    .check-label input { width: auto; }
    .stream-title { font-size: 1.2rem; margin: 0.8rem 0 0; }
    .small-link { font-size: 0.85rem; font-weight: 500; margin-left: 0.4rem; }
    .msg.bot { color: #a5b4fc; }
    .msg-time { color: var(--muted); font-size: 0.7rem; margin-left: 0.4rem; }
    .chat-error { margin: 0 0 0.4rem; font-size: 0.85rem; min-height: 0; }
    .chat-error:empty { display: none; }
    .mod-btns { display: inline-flex; gap: 0.25rem; margin-left: 0.3rem; vertical-align: middle; }
    .mod-btns button { width: auto; margin: 0; padding: 1px 6px; font-size: 0.68rem; border-radius: 4px; background: #2a3142; }
    .mod-btns button.ban { background: #7f1d1d; }
    .mod-btns button:disabled { opacity: 0.5; }
    .mod-list { list-style: none; padding: 0; margin: 0.4rem 0 0; font-size: 0.85rem; }
    .mod-list li { display: flex; justify-content: space-between; align-items: center; gap: 0.5rem; padding: 0.3rem 0; border-bottom: 1px solid var(--border); }
    .mod-list li button { width: auto; margin: 0; padding: 0.25rem 0.6rem; font-size: 0.8rem; }
    .mod-notice { background: #3b1d1d; color: #fecaca; border-radius: 8px; padding: 0.5rem 0.7rem; font-size: 0.85rem; margin: 0 0 0.4rem; }
    .mod-notice[hidden] { display: none; }
    .tip-btn { width: auto; margin: 0; padding: 0.6rem 0.7rem; background: #b45309; }
    .tip-btn:hover { background: #d97706; }
    .tip-btn[hidden] { display: none; }
    .quick-tip { background: #1a1f2e; border-radius: 8px; padding: 0.5rem; margin-top: 0.4rem; }
    .quick-tip[hidden] { display: none; }
    .quick-tip .row { display: flex; gap: 0.3rem; align-items: center; flex-wrap: wrap; }
    .quick-tip button { width: auto; margin: 0; padding: 0.4rem 0.7rem; font-size: 0.85rem; }
    .quick-tip input { flex: 1; min-width: 70px; padding: 0.4rem 0.6rem; }
    .quick-tip .message { margin: 0.3rem 0 0; font-size: 0.8rem; }
    .leaderboard { background: #1a1a22; border: 1px solid #333; border-radius: 10px; padding: 0.6rem 0.8rem; margin-bottom: 0.8rem; font-size: 0.85rem; }
    .leaderboard h4 { margin: 0 0 0.3rem; font-size: 0.85rem; }
    .leaderboard ol { margin: 0; padding-left: 1.3rem; }
    .leaderboard li { display: flex; justify-content: space-between; padding: 1px 0; }
    .leaderboard li span:last-child { color: var(--muted); }
  </style>
</head>
<body>
  <header class="dash-header">
    <a href="index.html" class="logo-row">
      <img src="assets/logo.jpg" alt="" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </a>
    <nav class="header-nav">
      <a href="dashboard.html">Dashboard</a>
      <a href="subscriptions.html">My Subscriptions</a>
      <button type="button" class="secondary" onclick="LonelyFansAuth.logout()">Logout</button>
    </nav>
  </header>

  <div class="live-layout">
    <div>
      <div class="video-area" id="videoArea">
        <video id="selfView" class="mirror" playsinline autoplay muted hidden></video>
        <canvas id="stagedFeed" hidden aria-label="Preview feed animation"></canvas>
        <div id="camOffCover" class="cam-off-cover" hidden>📷 Camera is off</div>
        <div class="ov ov-top" id="ovTop" hidden>
          <div class="live-badge" id="liveBadge">LIVE</div>
          <span class="pill" id="ovViewers" title="Viewers">👁 0</span>
          <span class="pill" id="ovTimer" title="Time live">00:00</span>
          <span class="ov-spacer"></span>
          <span class="preview-note" id="previewNote" hidden title="Real video broadcasting isn't enabled yet">Preview feed</span>
          <span class="pill" id="ovMuted" hidden>🔇 Muted</span>
        </div>
        <div class="ov ov-bottom" id="ovBottom" hidden>
          <div class="ov-name" id="ovName"></div>
          <div class="ov-goal" id="ovGoal" hidden></div>
        </div>
        <div class="stage-panel" id="stagePanel"><p id="videoText">Loading stream…</p></div>
      </div>
      <div id="camControls" class="cam-controls" hidden>
        <select id="camSelect" aria-label="Camera"></select>
        <select id="micSelect" aria-label="Microphone"></select>
        <button type="button" class="secondary" id="muteBtn" aria-pressed="false">🎙 Mute</button>
        <button type="button" class="secondary" id="camBtn" aria-pressed="false">📷 Camera off</button>
        <button type="button" class="end-btn" id="endBtn">End Stream</button>
      </div>
      <h2 id="streamTitle" class="stream-title"></h2>
      <div id="creatorControls" class="creator-controls" hidden>
        <h3>Chat Commands</h3>
        <form id="cmdForm" class="inline-form">
          <input id="cmdTrigger" placeholder="!hello" required pattern="!\S+" title="Commands start with ! and have no spaces" maxlength="30">
          <input id="cmdResponse" placeholder="Response" required maxlength="200">
          <button type="submit">Add</button>
        </form>
        <h3>Custom Emotes</h3>
        <form id="emoteForm" class="inline-form">
          <input id="emoteCode" placeholder=":heart:" required pattern=":[A-Za-z0-9_]+:" title="Use the form :name:" maxlength="30">
          <input id="emoteEmoji" placeholder="❤️" required maxlength="8" class="emoji-input">
          <button type="submit">Add</button>
        </form>
        <label class="check-label"><input type="checkbox" id="slowMode"> Slow mode (5s between messages)</label>
        <h3>Banned &amp; Timed-out Users</h3>
        <ul id="modList" class="mod-list"><li class="note">Loading…</li></ul>
        <p id="controlStatus" class="message" role="status"></p>
      </div>
    </div>
    <div class="side-panel">
      <div class="goal-box" id="goalBox"><div class="empty">Loading goal…</div></div>
      <div class="leaderboard" id="leaderboard"><h4>🏆 Top tippers</h4><div class="note">Loading…</div></div>
      <div class="chat-messages" id="chat" aria-live="polite"><div class="empty">Connecting to chat…</div></div>
      <p id="modNotice" class="mod-notice" role="alert" hidden></p>
      <p id="chatError" class="message chat-error" role="alert"></p>
      <form class="chat-input" id="chatForm">
        <button type="button" class="emoji-btn" id="emojiToggle" aria-label="Insert emoji">😊</button>
        <input type="text" id="chatInput" placeholder="Say something... or !command" maxlength="500" autocomplete="off">
        <button type="submit" id="sendBtn">Send</button>
        <button type="button" class="tip-btn" id="tipToggle" aria-label="Tip the creator" title="Tip the creator" hidden>💰</button>
      </form>
      <div id="quickTip" class="quick-tip" hidden>
        <div class="row">
          <button type="button" data-tip="10">10</button>
          <button type="button" data-tip="50">50</button>
          <button type="button" data-tip="100">100</button>
          <input type="number" id="quickTipAmount" min="1" step="1" placeholder="Other">
          <button type="button" id="quickTipSend">Tip</button>
        </div>
        <p id="quickTipMsg" class="message" role="status"></p>
      </div>
      <div id="emojiPicker" class="emoji-picker" hidden>
        <button type="button">❤️</button><button type="button">🔥</button><button type="button">😂</button>
        <button type="button">😍</button><button type="button">👍</button><button type="button">🎉</button>
      </div>
    </div>
  </div>

  <script src="live-stage.js?v=0eed3f39"></script>
  <script src="auth.js?v=188585ce"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const creatorId = params.get('id');
    const session = LonelyFansAuth.getSession();
    const esc = LonelyFansAuth.escapeHtml;
    const $ = (id) => document.getElementById(id);
    const isCreator = !!(session && creatorId && session.id === creatorId);
    let emotes = [];
    let editingGoal = false;

    function showError(id, text) {
      const el = $(id);
      el.className = 'message';
      el.textContent = text;
      if (text) setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 5000);
    }
    function showOk(id, text) {
      const el = $(id);
      el.className = 'message success';
      el.textContent = text;
      setTimeout(() => { if (el.textContent === text) el.textContent = ''; }, 3000);
    }

    // ---------- Video stage ----------
    const cam = isCreator && window.LiveStage ? new LiveStage.CreatorCam($('selfView')) : null;
    let creatorName = 'Creator';
    let liveStartedAt = null;
    let staged = null;
    let heartbeatTimer = null;
    let infoTimer = null;
    let tickTimer = null;

    function panel(html) {
      $('stagePanel').innerHTML = html;
      $('stagePanel').hidden = !html;
    }
    function showOverlays(on) {
      $('ovTop').hidden = !on;
      $('ovBottom').hidden = !on;
    }
    function tick() {
      $('ovTimer').textContent = liveStartedAt ? LiveStage.formatElapsed(Date.now() - liveStartedAt) : '00:00';
    }
    function updateGoalOverlay(goal) {
      const el = $('ovGoal');
      if (!goal) { el.hidden = true; return; }
      const pct = goal.target ? Math.min(100, (goal.current / goal.target) * 100) : 0;
      el.innerHTML = `🎯 ${esc(goal.text)} · ${Number(goal.current).toLocaleString()} / ${Number(goal.target).toLocaleString()}
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>`;
      el.hidden = false;
    }
    function applyLiveInfo(info) {
      $('ovViewers').textContent = `👁 ${Number(info.viewers || 0).toLocaleString()}`;
      if (info.startedAt) liveStartedAt = new Date(info.startedAt).getTime();
    }
    async function pollLiveInfo() {
      try {
        if (isCreator) applyLiveInfo(await LonelyFansAuth.getLiveInfo(creatorId));
        else {
          const info = await LonelyFansAuth.api(`/live/${encodeURIComponent(creatorId)}/view`, { method: 'POST', body: JSON.stringify({ viewerKey: viewerKey() }) });
          if (!info.isLive) return showViewerOffline();
          if (!staged) showViewerLive();
          applyLiveInfo(info);
        }
      } catch {}
    }
    function viewerKey() {
      let k = localStorage.getItem('lf_viewer_key');
      if (!k || !/^[A-Za-z0-9-]{8,64}$/.test(k)) {
        k = (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));
        localStorage.setItem('lf_viewer_key', k);
      }
      return k;
    }

    // Viewer side: staged feed while the creator is live
    function showViewerLive() {
      $('stagedFeed').hidden = false;
      if (!staged) staged = LiveStage.startStagedFeed($('stagedFeed'), creatorId);
      $('previewNote').hidden = false;
      showOverlays(true);
      panel('');
    }
    function showViewerOffline() {
      if (staged) { staged.stop(); staged = null; }
      $('stagedFeed').hidden = true;
      showOverlays(false);
      liveStartedAt = null;
      panel(`<h3>${esc(creatorName)} is offline right now</h3><p>Chat stays open — say hi, and follow to see when they go live.</p>`);
    }

    // Creator side: Go Live flow
    function showGoLivePanel() {
      const problem = LiveStage.cameraSupportProblem();
      if (problem) return showCamError(problem);
      panel(`<h3>Ready to go live?</h3><p>We'll ask to use your camera and microphone. Your preview is mirrored, like a selfie.</p>
        <button type="button" class="go-live-btn" id="goLiveBtn">🔴 Go Live</button>`);
      $('goLiveBtn').onclick = () => startStream();
    }
    function showCamError(kind) {
      const e = LiveStage.CAM_ERRORS[kind] || LiveStage.CAM_ERRORS.other;
      panel(`<h3>${esc(e.title)}</h3><p>${esc(e.text)}</p><button type="button" id="camRetry">Try again</button>`);
      $('stagePanel').dataset.state = kind;
      $('camRetry').onclick = () => startStream();
    }
    async function fillDevicePickers() {
      try {
        const { cams, mics } = await cam.devices();
        const opts = (list, cur, label) => list.map((d, i) =>
          `<option value="${esc(d.deviceId)}" ${d.deviceId === cur ? 'selected' : ''}>${esc(d.label || `${label} ${i + 1}`)}</option>`).join('');
        $('camSelect').innerHTML = opts(cams, cam.camId, 'Camera') || '<option value="">No camera</option>';
        $('micSelect').innerHTML = opts(mics, cam.micId, 'Microphone') || '<option value="">No microphone</option>';
        $('micSelect').disabled = !mics.length;
      } catch {}
    }
    function syncToggles() {
      $('muteBtn').setAttribute('aria-pressed', String(cam.muted));
      $('muteBtn').textContent = cam.muted ? '🔇 Unmute' : '🎙 Mute';
      $('muteBtn').disabled = !cam.hasMic;
      $('camBtn').setAttribute('aria-pressed', String(cam.cameraOff));
      $('camBtn').textContent = cam.cameraOff ? '📷 Camera on' : '📷 Camera off';
      $('ovMuted').hidden = !cam.muted;
      $('camOffCover').hidden = !cam.cameraOff;
    }
    async function startStream(opts) {
      const problem = LiveStage.cameraSupportProblem();
      if (problem) return showCamError(problem);
      panel('<p>Starting camera… allow access if your browser asks.</p>');
      try {
        await cam.start(opts);
      } catch (err) {
        return showCamError(LiveStage.classifyError(err));
      }
      delete $('stagePanel').dataset.state;
      $('selfView').hidden = false;
      panel('');
      $('camControls').hidden = false;
      showOverlays(true);
      syncToggles();
      fillDevicePickers();
      try {
        await LonelyFansAuth.setLive(creatorId, true);
        liveStartedAt = liveStartedAt || Date.now();
      } catch (err) {
        showError('controlStatus', `Camera is on, but going live failed: ${err.message}`);
      }
      clearInterval(heartbeatTimer);
      heartbeatTimer = setInterval(() => LonelyFansAuth.sendLiveHeartbeat().catch(() => {}), 30000);
      clearInterval(tickTimer); tickTimer = setInterval(tick, 1000); tick();
      clearInterval(infoTimer); infoTimer = setInterval(pollLiveInfo, 10000); pollLiveInfo();
    }
    async function endStream({ keepalive = false } = {}) {
      clearInterval(heartbeatTimer); clearInterval(infoTimer); clearInterval(tickTimer);
      heartbeatTimer = infoTimer = tickTimer = null;
      const wasLive = cam && cam.active;
      if (cam) cam.stop();
      $('selfView').hidden = true;
      $('camOffCover').hidden = true;
      $('camControls').hidden = true;
      showOverlays(false);
      liveStartedAt = null;
      if (wasLive || keepalive) await LonelyFansAuth.setLive(creatorId, false, { keepalive }).catch(() => {});
      if (!keepalive) showGoLivePanel();
    }
    function initCamControls() {
      $('muteBtn').onclick = () => { cam.setMuted(!cam.muted); syncToggles(); };
      $('camBtn').onclick = () => { cam.setCameraOff(!cam.cameraOff); syncToggles(); };
      $('endBtn').onclick = async () => {
        $('endBtn').disabled = true;
        await endStream();
        $('endBtn').disabled = false;
        showOk('controlStatus', 'Stream ended. You are offline.');
      };
      $('camSelect').onchange = () => startStream({ camId: $('camSelect').value });
      $('micSelect').onchange = () => startStream({ micId: $('micSelect').value });
      if (navigator.mediaDevices && navigator.mediaDevices.addEventListener) {
        navigator.mediaDevices.addEventListener('devicechange', () => { if (cam.active) fillDevicePickers(); });
      }
      // Leaving the page stops the camera and goes offline
      window.addEventListener('pagehide', () => endStream({ keepalive: true }));
    }

    async function loadHeader() {
      const [profile, live] = await Promise.all([
        LonelyFansAuth.getProfile(creatorId).catch(() => null),
        LonelyFansAuth.isLive(creatorId)
      ]);
      creatorName = (profile && profile.displayName) || 'Creator';
      $('streamTitle').innerHTML = `${esc(creatorName)} <a href="creator.html?id=${encodeURIComponent(creatorId)}" class="small-link">View page →</a>`;
      $('ovName').textContent = creatorName;
      document.title = creatorName + ' – Live – Lonely Fans';
      if (isCreator) {
        if (!cam) return panel('<h3>Live video unavailable</h3><p>Reload the page to try again.</p>');
        initCamControls();
        showGoLivePanel();
      } else {
        if (live) { showViewerLive(); pollLiveInfo(); } else showViewerOffline();
        clearInterval(tickTimer); tickTimer = setInterval(tick, 1000);
        setInterval(pollLiveInfo, 20000);
      }
    }

    async function renderGoal() {
      // Don't wipe the form while the creator is typing a new goal
      if (editingGoal || (document.activeElement && $('goalBox').contains(document.activeElement))) return;
      const goal = await LonelyFansAuth.getCreatorGoal(creatorId);
      updateGoalOverlay(goal);
      const box = $('goalBox');
      if (!goal) {
        box.innerHTML = isCreator ? goalForm() : '<div class="empty">No active goal</div>';
        return;
      }
      const pct = goal.target ? Math.min(100, (goal.current / goal.target) * 100) : 0;
      box.innerHTML = `
        <strong>${esc(goal.text)}</strong>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div>${goal.current.toLocaleString()} / ${goal.target.toLocaleString()} SparkCoins</div>
        ${goal.completed ? '<div class="positive">Goal completed! 🎉</div>' : ''}
        ${!isCreator && !goal.completed ? `
          <form class="inline-form" onsubmit="tip(event)">
            <input type="number" id="tipAmount" placeholder="Amount" min="1" step="1" required>
            <button type="submit" id="tipBtn">Tip</button>
          </form>` : ''}
        ${isCreator ? '<button type="button" class="secondary small-btn" onclick="editGoal()">New goal</button>' : ''}
        <p id="goalMsg" class="message" role="status"></p>
      `;
    }
    function goalForm() {
      return `<form onsubmit="setGoal(event)" class="goal-form">
          <input id="goalText" placeholder="Goal text (e.g. New mic)" required maxlength="80">
          <input id="goalTarget" type="number" min="1" step="1" placeholder="Target SparkCoins" required>
          <button type="submit">Set Goal</button>
          <p id="goalMsg" class="message" role="status"></p>
        </form>`;
    }
    function editGoal() {
      editingGoal = true;
      $('goalBox').innerHTML = goalForm();
      $('goalText').focus();
    }

    async function setGoal(e) {
      e.preventDefault();
      const btn = e.target.querySelector('button');
      const text = $('goalText').value.trim();
      const target = parseInt($('goalTarget').value, 10);
      if (!text || !(target > 0)) return showError('goalMsg', 'Enter a goal and a target above 0.');
      btn.disabled = true; btn.textContent = 'Saving…';
      try {
        await LonelyFansAuth.setCreatorGoal(creatorId, text, target);
        editingGoal = false;
        document.activeElement && document.activeElement.blur();
        await renderGoal();
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Set Goal';
        showError('goalMsg', err.message);
      }
    }

    async function tip(e) {
      e.preventDefault();
      if (!session) { location.href = 'login.html'; return; }
      const amount = parseInt($('tipAmount').value, 10);
      if (!(amount > 0)) return showError('goalMsg', 'Enter a tip of at least 1 SparkCoin.');
      const btn = $('tipBtn');
      btn.disabled = true; btn.textContent = '…';
      try {
        await LonelyFansAuth.tipGoal(session.id, creatorId, amount);
        document.activeElement && document.activeElement.blur();
        await renderGoal();
        showOk('goalMsg', `Thanks! You tipped ${amount} SparkCoins.`);
        renderLeaderboard();
      } catch (err) {
        btn.disabled = false; btn.textContent = 'Tip';
        showError('goalMsg', err.message);
      }
    }

    function replaceEmotes(safeText) {
      let t = safeText;
      emotes.forEach(e => {
        const code = esc(e.code).replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
        t = t.replace(new RegExp(code, 'gi'), `<span class="emote">${esc(e.emoji)}</span>`);
      });
      return t;
    }

    function renderMessages(msgs) {
      const el = $('chat');
      if (!Array.isArray(msgs) || msgs.length === 0) {
        el.innerHTML = '<div class="empty">No messages yet. Say hello!</div>';
        return;
      }
      const atBottom = el.scrollHeight - el.scrollTop - el.clientHeight < 40;
      el.innerHTML = msgs.map(m => {
        const badge = m.is_sub ? '<span class="badge">SUB</span>' : '';
        const d = LonelyFansAuth.parseServerDate(m.created_at);
        const time = d ? d.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '';
        const canMod = isCreator && m.user_id && m.user_id !== session.id && m.username !== 'Bot';
        const mod = canMod ? `<span class="mod-btns"><button type="button" data-mod="timeout" data-user="${esc(m.user_id)}" data-name="${esc(m.username)}" title="Timeout 5 minutes">Timeout</button><button type="button" class="ban" data-mod="ban" data-user="${esc(m.user_id)}" data-name="${esc(m.username)}" title="Ban from chat">Ban</button></span>` : '';
        return `<div class="msg ${m.username === 'Bot' ? 'bot' : ''}">${badge}<strong>${esc(m.username)}:</strong> ${replaceEmotes(esc(m.text))} <span class="msg-time">${time}</span>${mod}</div>`;
      }).join('');
      if (atBottom) el.scrollTop = el.scrollHeight;
    }

    // Creator moderation: Timeout (5 min) / Ban buttons on fan messages
    async function moderate(btn) {
      const action = btn.dataset.mod, userId = btn.dataset.user, name = btn.dataset.name;
      if (action === 'ban' && !confirm(`Ban ${name} from your chat?`)) return;
      btn.disabled = true;
      try {
        await LonelyFansAuth.api(`/mod/${action}`, { method: 'POST', body: JSON.stringify(action === 'timeout' ? { userId, minutes: 5 } : { userId }) });
        showOk('controlStatus', action === 'ban' ? `${name} is banned.` : `${name} is timed out for 5 minutes.`);
        loadModList();
      } catch (err) {
        showError('chatError', err.message);
      } finally {
        btn.disabled = false;
      }
    }

    async function loadModList() {
      const el = $('modList');
      try {
        const list = await LonelyFansAuth.api('/mod/list');
        if (!list.length) { el.innerHTML = '<li class="note">No one is banned or timed out.</li>'; return; }
        el.innerHTML = list.map(u => {
          const until = u.type === 'timeout' ? LonelyFansAuth.parseServerDate(u.expiresAt) : null;
          const label = u.type === 'ban' ? 'Banned' : `Timed out until ${until ? until.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }) : '?'}`;
          return `<li><span><strong>${esc(u.username)}</strong> <span class="note">${esc(label)}</span></span><button type="button" class="secondary" data-unban="${esc(u.userId)}" data-name="${esc(u.username)}">${u.type === 'ban' ? 'Unban' : 'Lift'}</button></li>`;
        }).join('');
      } catch (err) {
        el.innerHTML = `<li class="message">Couldn't load list: ${esc(err.message)}</li>`;
      }
    }

    async function unban(btn) {
      btn.disabled = true; btn.textContent = '…';
      try {
        await LonelyFansAuth.api('/mod/unban', { method: 'POST', body: JSON.stringify({ userId: btn.dataset.unban }) });
        showOk('controlStatus', `${btn.dataset.name} can chat again.`);
      } catch (err) {
        showError('controlStatus', err.message);
      }
      loadModList();
    }

    // Fans: tell them up front if they're banned or timed out
    function showModNotice(text) {
      $('modNotice').textContent = text;
      $('modNotice').hidden = !text;
      $('chatInput').disabled = !!text;
      $('sendBtn').disabled = !!text;
    }
    let modTimer = null;
    async function checkModStatus() {
      try {
        const s = await LonelyFansAuth.api(`/mod/status/${encodeURIComponent(creatorId)}`);
        clearTimeout(modTimer);
        if (s.banned) return showModNotice('You are banned from this chat by the creator.');
        const until = s.timedOutUntil && LonelyFansAuth.parseServerDate(s.timedOutUntil);
        if (until && until > new Date()) {
          showModNotice(`You are timed out from this chat until ${until.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' })}.`);
          modTimer = setTimeout(checkModStatus, Math.min(until - new Date() + 1000, 60000));
          return;
        }
        showModNotice('');
      } catch {}
    }

    async function renderLeaderboard() {
      const el = $('leaderboard');
      try {
        const top = await LonelyFansAuth.api(`/tips/${encodeURIComponent(creatorId)}/top`);
        el.innerHTML = '<h4>🏆 Top tippers</h4>' + (top.length
          ? `<ol>${top.map(t => `<li><span>${esc(t.username)}</span><span>${Number(t.total).toLocaleString()} SC</span></li>`).join('')}</ol>`
          : '<div class="note">No tips yet — be the first!</div>');
      } catch (err) {
        el.innerHTML = `<h4>🏆 Top tippers</h4><div class="note">Couldn't load: ${esc(err.message)}</div>`;
      }
    }

    async function quickTip(amount) {
      if (!(amount > 0) || !Number.isInteger(amount)) return showError('quickTipMsg', 'Enter a whole number of SparkCoins.');
      if (!confirm(`Tip ${amount.toLocaleString()} SparkCoins?`)) return;
      const btns = $('quickTip').querySelectorAll('button');
      btns.forEach(b => b.disabled = true);
      try {
        const r = await LonelyFansAuth.api('/tips', { method: 'POST', body: JSON.stringify({ creatorId, amount }) });
        $('quickTipAmount').value = '';
        showOk('quickTipMsg', `Thanks! You tipped ${amount.toLocaleString()} SparkCoins (balance ${r.balance.toLocaleString()}).`);
        renderLeaderboard();
      } catch (err) {
        const el = $('quickTipMsg');
        el.className = 'message';
        el.innerHTML = `${esc(err.message)}${/SparkCoins/.test(err.message) ? ' <a href="wallet.html">Buy SparkCoins</a>' : ''}`;
      } finally {
        btns.forEach(b => b.disabled = false);
      }
    }

    async function renderChat() {
      renderMessages(await LonelyFansAuth.getChatMessages(creatorId));
    }

    function startChatStream() {
      if (!window.EventSource) { renderChat(); setInterval(renderChat, 2500); return; }
      const es = new EventSource(`${LonelyFansAuth.API_BASE}/chat/${encodeURIComponent(creatorId)}/stream`);
      es.onmessage = (e) => {
        try { renderMessages(JSON.parse(e.data)); } catch {}
      };
      es.onerror = () => {
        es.close();
        setTimeout(startChatStream, 2500);
      };
    }

    async function sendChat(e) {
      e.preventDefault();
      const input = $('chatInput');
      const text = input.value.trim();
      if (!text) return;
      if (!session) { location.href = 'login.html'; return; }
      const btn = $('sendBtn');
      btn.disabled = true;
      try {
        await LonelyFansAuth.addChatMessage(creatorId, session.email.split('@')[0], text);
        input.value = '';
        $('chatError').textContent = '';
        await renderChat();
      } catch (err) {
        showError('chatError', err.message);
        if (/banned|timed out/i.test(err.message)) checkModStatus();
      } finally {
        if ($('modNotice').hidden) { btn.disabled = false; input.focus(); }
      }
    }

    async function loadEmotes() {
      try { emotes = await LonelyFansAuth.api(`/emotes/${encodeURIComponent(creatorId)}`); } catch {}
    }

    async function postControl(path, body, form, okText) {
      const btn = form && form.querySelector('button');
      if (btn) btn.disabled = true;
      try {
        await LonelyFansAuth.api(path, { method: 'POST', body: JSON.stringify(body) });
        if (form) form.reset();
        showOk('controlStatus', okText);
        return true;
      } catch (err) {
        showError('controlStatus', err.message);
        return false;
      } finally {
        if (btn) btn.disabled = false;
      }
    }

    function initCreatorControls() {
      $('creatorControls').hidden = false;
      $('cmdForm').addEventListener('submit', (e) => {
        e.preventDefault();
        const trigger = $('cmdTrigger').value.trim();
        postControl('/commands', { trigger, response: $('cmdResponse').value.trim() }, e.target, `Command ${trigger} added.`);
      });
      $('emoteForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const code = $('emoteCode').value.trim();
        if (await postControl('/emotes', { code, emoji: $('emoteEmoji').value.trim() }, e.target, `Emote ${code} added.`)) loadEmotes();
      });
      LonelyFansAuth.api(`/settings/${encodeURIComponent(creatorId)}`)
        .then(s => { $('slowMode').checked = !!s.slow_mode; }).catch(() => {});
      $('slowMode').addEventListener('change', async (e) => {
        const on = e.target.checked;
        if (!await postControl('/settings', { slow_mode: on }, null, `Slow mode ${on ? 'on' : 'off'}.`)) e.target.checked = !on;
      });
      $('chat').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-mod]');
        if (b) moderate(b);
      });
      $('modList').addEventListener('click', (e) => {
        const b = e.target.closest('button[data-unban]');
        if (b) unban(b);
      });
      loadModList();
      // Going live now happens when the camera starts (see startStream)
    }

    $('emojiToggle').addEventListener('click', () => { $('emojiPicker').hidden = !$('emojiPicker').hidden; });
    $('emojiPicker').addEventListener('click', (e) => {
      if (e.target.tagName !== 'BUTTON') return;
      $('chatInput').value += e.target.textContent;
      $('chatInput').focus();
    });
    $('chatForm').addEventListener('submit', sendChat);
    $('tipToggle').addEventListener('click', () => { $('quickTip').hidden = !$('quickTip').hidden; });
    $('quickTip').addEventListener('click', (e) => {
      const b = e.target.closest('button');
      if (!b) return;
      if (b.dataset.tip) quickTip(parseInt(b.dataset.tip, 10));
      else if (b.id === 'quickTipSend') quickTip(parseInt($('quickTipAmount').value, 10));
    });

    if (!creatorId) {
      document.querySelector('.live-layout').innerHTML =
        '<div class="empty-state" style="grid-column:1/-1">No creator selected. <a href="browse.html">Browse creators</a></div>';
    } else {
      if (!session) {
        $('chatInput').placeholder = 'Log in to chat';
        $('chatInput').disabled = true;
        $('sendBtn').textContent = 'Log in';
        $('sendBtn').type = 'button';
        $('sendBtn').onclick = () => { location.href = 'login.html'; };
      }
      if (isCreator) initCreatorControls();
      else if (session) { checkModStatus(); setInterval(checkModStatus, 15000); $('tipToggle').hidden = false; }
      renderLeaderboard();
      setInterval(renderLeaderboard, 10000);
      loadHeader();
      loadEmotes().then(renderGoal);
      startChatStream();
      setInterval(renderGoal, 4000);
    }
  </script>
</body>
</html>
