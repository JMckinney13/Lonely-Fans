<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Live – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
  <style>
    .live-layout { display: grid; grid-template-columns: 1fr 340px; gap: 1rem; max-width: 1200px; margin: 1rem auto; padding: 0 1rem; }
    @media (max-width: 800px) { 
      .live-layout { grid-template-columns: 1fr; } 
      .side-panel { height: 50vh; }
    }
    .empty { color: var(--muted); text-align: center; padding: 1.5rem; font-size: 0.9rem; }
    .video-area { background: #000; border-radius: 12px; aspect-ratio: 16/9; display: flex; align-items: center; justify-content: center; color: #666; position: relative; }
    .video-area .live-badge { position: absolute; top: 12px; left: 12px; background: #ff6b6b; color: white; padding: 4px 10px; border-radius: 999px; font-size: 0.8rem; font-weight: 700; }
    .side-panel { background: var(--card); border-radius: 12px; padding: 1rem; display: flex; flex-direction: column; height: 70vh; }
    .goal-box { background: #1a1a22; border: 1px solid #333; border-radius: 10px; padding: 0.8rem; margin-bottom: 1rem; }
    .progress-bar { height: 8px; background: #333; border-radius: 4px; overflow: hidden; margin: 0.5rem 0; }
    .progress-fill { height: 100%; background: var(--accent); width: 0%; transition: width 0.3s; }
    .chat-messages { flex: 1; overflow-y: auto; font-size: 0.85rem; margin-bottom: 0.5rem; padding: 0.5rem; background: #0e121c; border-radius: 8px; }
    .chat-messages .msg { margin-bottom: 0.35rem; word-break: break-word; }
    .badge { display: inline-block; background: #ff6b6b; color: white; font-size: 0.65rem; padding: 1px 4px; border-radius: 3px; margin-right: 4px; vertical-align: middle; }
    .emote { font-size: 1.1rem; vertical-align: middle; }
    .chat-input { display: flex; gap: 0.4rem; align-items: center; }
    .chat-input input { flex: 1; }
    .emoji-btn { background: transparent; border: none; font-size: 1.2rem; cursor: pointer; padding: 0.3rem; }
  </style>
</head>
<body>
  <header class="dash-header">
    <div class="logo-row">
      <img src="assets/logo.jpg" alt="Lonely Fans" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </div>
    <div>
      <a href="dashboard.html">Dashboard</a>
      <button onclick="LonelyFansAuth.logout()" style="width:auto; margin-left:1rem;">Logout</button>
    </div>
  </header>

  <div class="live-layout">
    <div>
      <div class="video-area" id="videoArea">
        <div class="live-badge">LIVE</div>
        Simulated stream – creator is on camera
      </div>
      <div style="margin-top:1rem" id="creatorControls">
        ${isCreator ? `
          <h3>Chat Commands</h3>
          <form onsubmit="addCommand(event)" style="display:flex;gap:0.4rem">
            <input id="cmdTrigger" placeholder="!hello" style="flex:1">
            <input id="cmdResponse" placeholder="Response" style="flex:2">
            <button style="width:auto">Add</button>
          </form>
          <h3 style="margin-top:1rem">Custom Emotes</h3>
          <form onsubmit="addEmote(event)" style="display:flex;gap:0.4rem">
            <input id="emoteCode" placeholder=":heart:" style="flex:1">
            <input id="emoteEmoji" placeholder="❤️" style="width:60px">
            <button style="width:auto">Add</button>
          </form>
          <label style="margin-top:0.8rem"><input type="checkbox" id="slowMode" onchange="toggleSlow()"> Slow mode</label>
        ` : ''}
      </div>
    </div>
    <div class="side-panel">
      <div class="goal-box" id="goalBox">No active goal</div>
      <div id="tipFeed" style="font-size:0.8rem;color:var(--muted);margin-bottom:0.6rem;max-height:60px;overflow:hidden"></div>
      <div class="chat-messages" id="chat"></div>
      <div class="chat-input">
        <button class="emoji-btn" onclick="toggleEmoji()">😊</button>
        <input type="text" id="chatInput" placeholder="Say something... or !command">
        <button style="width:auto; margin:0" onclick="sendChat()">Send</button>
      </div>
      <div id="emojiPicker" style="display:none; background:#1a1f2e; padding:0.5rem; border-radius:8px; margin-top:0.3rem; font-size:1.2rem;">
        <span onclick="insertEmoji('❤️')">❤️</span>
        <span onclick="insertEmoji('🔥')">🔥</span>
        <span onclick="insertEmoji('😂')">😂</span>
        <span onclick="insertEmoji('😍')">😍</span>
        <span onclick="insertEmoji('👍')">👍</span>
        <span onclick="insertEmoji('🎉')">🎉</span>
      </div>
    </div>
  </div>

  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(location.search);
    const creatorId = params.get('id');
    const session = LonelyFansAuth.getSession();
    if (!creatorId) { alert('No creator'); location.href = 'index.html'; }

    const isCreator = session && session.id === creatorId;

    function renderTipFeed() {
      const tips = LonelyFansAuth.getRecentTips(creatorId);
      const el = document.getElementById('tipFeed');
      if (!tips.length) { el.innerHTML = ''; return; }
      el.innerHTML = tips.map(t => `<div>+${t.amount} SparkCoins tip</div>`).join('');
    }

    function celebrateGoal() {
      const box = document.getElementById('goalBox');
      box.style.boxShadow = '0 0 0 3px #34d399';
      setTimeout(() => box.style.boxShadow = '', 2000);
    }
      const goal = LonelyFansAuth.getCreatorGoal(creatorId);
      const box = document.getElementById('goalBox');
      if (!goal) {
        box.innerHTML = isCreator
          ? `<form onsubmit="setGoal(event)"><input id="goalText" placeholder="Goal text" required><input id="goalTarget" type="number" placeholder="Target SparkCoins" required><button>Set Goal</button></form>`
          : '<div class="empty-state" style="padding:1rem">No active goal</div>';
        return;
      }
      const pct = Math.min(100, (goal.current / goal.target) * 100);
      box.innerHTML = `
        <strong>${goal.text}</strong>
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <div>${goal.current.toLocaleString()} / ${goal.target.toLocaleString()} SparkCoins</div>
        ${goal.completed ? '<div class="positive">Goal completed!</div>' : ''}
        ${!isCreator && !goal.completed ? `
          <div style="margin-top:0.5rem">
            <input type="number" id="tipAmount" placeholder="Amount" style="width:100px">
            <button style="width:auto" onclick="tip()">Tip</button>
          </div>` : ''}
      `;
    }

    function setGoal(e) {
      e.preventDefault();
      const text = document.getElementById('goalText').value;
      const target = parseInt(document.getElementById('goalTarget').value, 10);
      LonelyFansAuth.setCreatorGoal(creatorId, text, target);
      renderGoal();
    }

    function tip() {
      if (!session) { location.href = 'login.html'; return; }
      const amount = parseInt(document.getElementById('tipAmount').value, 10);
      if (!amount || amount < 1) return;
      try {
        LonelyFansAuth.tipGoal(session.id, creatorId, amount);
        renderGoal();
      } catch (err) {
        const box = document.getElementById('goalBox');
        box.insertAdjacentHTML('beforeend', `<div class="message">${err.message}</div>`);
      }
    }

    function startChatStream() {
      let es;
      try {
        es = new EventSource(`${LonelyFansAuth.API_BASE}/chat/${creatorId}/stream`);
      } catch {
        setInterval(renderChatFallback, 2500);
        return;
      }
      es.onmessage = (e) => {
        try {
          const msgs = JSON.parse(e.data);
          renderMessages(msgs);
        } catch {}
      };
      es.onerror = () => {
        es.close();
        setTimeout(startChatStream, 2500);
      };
    }

    function renderMessages(msgs) {
      const el = document.getElementById('chat');
      if (!msgs || msgs.length === 0) {
        el.innerHTML = '<div class="empty">No messages yet. Say hello!</div>';
        return;
      }
      el.innerHTML = msgs.map(m => {
        const badge = m.is_sub ? '<span class="badge">SUB</span>' : '';
        const text = replaceEmotes(m.text || '');
        const time = m.created_at ? new Date(m.created_at).toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'}) : '';
        return `<div class="msg ${m.username === 'Bot' ? 'bot' : ''}">${badge}<strong>${m.username}:</strong> ${text} <span style="color:var(--muted);font-size:0.7rem;margin-left:0.4rem">${time}</span></div>`;
      }).join('');
      el.scrollTop = el.scrollHeight;
    }

    function renderChatFallback() {
      const msgs = LonelyFansAuth.getChatMessages(creatorId);
      renderMessages(msgs);
    }

    let emotes = [];
    async function loadEmotes() {
      try {
        emotes = await LonelyFansAuth.api(`/emotes/${creatorId}`);
      } catch {}
    }
    function replaceEmotes(text) {
      let t = text;
      emotes.forEach(e => {
        t = t.replace(new RegExp(e.code, 'gi'), `<span class="emote">${e.emoji}</span>`);
      });
      return t;
    }

    function sendChat() {
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text || !session) return;
      LonelyFansAuth.addChatMessage(creatorId, session.email.split('@')[0], text);
      input.value = '';
      setTimeout(renderChat, 200);
    }

    function toggleEmoji() {
      const p = document.getElementById('emojiPicker');
      p.style.display = p.style.display === 'none' ? 'block' : 'none';
    }
    function insertEmoji(e) {
      const input = document.getElementById('chatInput');
      input.value += e;
      input.focus();
    }

    async function addEmote(e) {
      e.preventDefault();
      const code = document.getElementById('emoteCode').value;
      const emoji = document.getElementById('emoteEmoji').value;
      try {
        await LonelyFansAuth.api('/emotes', { method: 'POST', body: JSON.stringify({ code, emoji }) });
        e.target.reset();
        loadEmotes();
      } catch (err) {
        alert(err.message); // keep for now — rare
      }
    }
    async function toggleSlow() {
      const on = document.getElementById('slowMode').checked;
      await LonelyFansAuth.api('/settings', { method: 'POST', body: JSON.stringify({ slow_mode: on }) });
    }

    loadEmotes();
      if (!session) { alert('Log in to chat'); return; }
      const input = document.getElementById('chatInput');
      const text = input.value.trim();
      if (!text) return;
      const name = session.email.split('@')[0];
      LonelyFansAuth.addChatMessage(creatorId, name, text);
      input.value = '';
      renderChat();
    }

    document.getElementById('chatInput').addEventListener('keypress', e => {
      if (e.key === 'Enter') sendChat();
    });

    // Mark live when creator opens the page
    if (isCreator) LonelyFansAuth.setLive(creatorId, true);

    renderGoal();
    renderTipFeed();
    startChatStream();
    setInterval(renderGoal, 3000);
    setInterval(renderTipFeed, 4000);
  </script>
</body>
</html>
