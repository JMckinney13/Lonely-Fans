<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Page – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="dash-header">
    <a href="index.html" class="logo-row">
      <img src="assets/logo.jpg" alt="" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </a>
    <nav class="header-nav" id="creatorNav">
      <a href="index.html">Home</a>
    </nav>
  </header>
  <main id="creatorPage" class="creator-page">
    <p>Loading creator...</p>
  </main>
  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const creatorId = params.get('id');
    const session = LonelyFansAuth.getSession();
    const esc = LonelyFansAuth.escapeHtml;
    const page = document.getElementById('creatorPage');

    if (session) {
      document.getElementById('creatorNav').innerHTML = '<a href="browse.html">Browse</a><a href="dashboard.html">Dashboard</a>';
    }

    function safeUrl(url) {
      try { const u = new URL(url); return ['http:', 'https:'].includes(u.protocol) ? u.href : ''; } catch { return ''; }
    }
    const safeColor = (c, d) => /^#[0-9a-f]{3,8}$/i.test(c || '') ? c : d;

    async function load() {
      page.innerHTML = '<div class="empty-state">Loading creator…</div>';
      try {
        const profile = await LonelyFansAuth.getProfile(creatorId);
        if (!profile) {
          page.innerHTML = '<div class="empty-state">Creator not found. <a href="browse.html">Browse creators</a></div>';
          return;
        }
        const isOwner = !!(session && session.id === creatorId);
        const [tiers, subscribed, live, following] = await Promise.all([
          LonelyFansAuth.getCreatorTiers(creatorId),
          session && !isOwner ? LonelyFansAuth.isSubscribed(session.id, creatorId) : false,
          LonelyFansAuth.isLive(creatorId),
          session && !isOwner ? LonelyFansAuth.isFollowing(session.id, creatorId).catch(() => false) : false
        ]);

        page.style.setProperty('--theme', safeColor(profile.themeColor, '#ff6b6b'));
        page.style.setProperty('--accent', safeColor(profile.accentColor, '#ff8e8e'));
        page.className = 'creator-page layout-' + (['classic', 'minimal', 'bold'].includes(profile.layout) ? profile.layout : 'classic');

        const tiersHtml = !tiers || tiers.length === 0
          ? '<p class="note">No subscription tiers set yet.</p>'
          : tiers.map(t => `
            <div class="tier-card">
              <h3>${esc(t.name)}</h3>
              <div class="price">${Number(t.price).toLocaleString()} SparkCoins / month</div>
              <ul>${(t.perks || []).map(p => `<li>${esc(p)}</li>`).join('')}</ul>
              ${isOwner ? '' : subscribed ? '<button disabled>Subscribed</button>' :
                `<button onclick="doSubscribe(this, '${esc(t.id)}', ${Number(t.price)})">Subscribe</button>`}
            </div>
          `).join('');

        const banner = safeUrl(profile.bannerUrl);
        page.innerHTML = `
          ${banner ? `<div class="banner" style="background-image:url('${esc(encodeURI(banner))}')"></div>` : ''}
          <div class="info-card">
            <h1>${esc(profile.displayName || 'Creator')} ${live ? '<span class="live-dot">● LIVE</span>' : ''}</h1>
            <p>${esc(profile.bio || 'No bio yet.')}</p>
            <div class="card-actions">
              <a href="live.html?id=${encodeURIComponent(creatorId)}" class="btn small">${isOwner ? 'Go Live' : live ? 'Watch Live' : 'Stream &amp; Chat'}</a>
              ${isOwner ? '<a href="customize.html" class="btn small secondary">Edit Page</a>' : ''}
              ${session && !isOwner ? `<button class="secondary btn small" id="followBtn" onclick="doFollow(this)">${following ? 'Following' : 'Follow'}</button>` : ''}
            </div>
            <h2>Subscription Tiers</h2>
            <p id="subMsg" class="message" role="status"></p>
            <div class="tiers">${tiersHtml}</div>
          </div>
        `;
        document.title = (profile.displayName || 'Creator') + ' – Lonely Fans';
      } catch (err) {
        page.innerHTML = `<div class="empty-state">Failed to load creator: ${esc(err.message)}</div>`;
      }
    }

    async function doFollow(btn) {
      if (!session) { location.href = 'login.html'; return; }
      const prev = btn.textContent;
      btn.disabled = true;
      btn.textContent = '…';
      try {
        const nowFollowing = await LonelyFansAuth.toggleFollow(session.id, creatorId);
        btn.textContent = nowFollowing ? 'Following' : 'Follow';
      } catch (err) {
        btn.textContent = prev;
        const msg = document.getElementById('subMsg');
        msg.className = 'message';
        msg.textContent = err.message;
      } finally {
        btn.disabled = false;
      }
    }

    async function doSubscribe(btn, tierId, price) {
      if (!session) { location.href = 'login.html'; return; }
      if (!confirm(`Subscribe for ${price.toLocaleString()} SparkCoins?`)) return;
      btn.disabled = true;
      btn.textContent = 'Subscribing…';
      try {
        await LonelyFansAuth.subscribe(session.id, creatorId, tierId, price);
        await load();
        const msg = document.getElementById('subMsg');
        msg.className = 'message success';
        msg.textContent = 'Subscribed! You now get a SUB badge in chat.';
      } catch (err) {
        btn.disabled = false;
        btn.textContent = 'Subscribe';
        const msg = document.getElementById('subMsg');
        msg.className = 'message';
        msg.innerHTML = `${esc(err.message)}${/SparkCoins/.test(err.message) ? ' <a href="wallet.html">Buy SparkCoins</a>' : ''}`;
      }
    }

    if (!creatorId) {
      page.innerHTML = '<div class="empty-state">No creator specified. <a href="browse.html">Browse creators</a></div>';
    } else {
      load();
    }
  </script>
</body>
</html>
