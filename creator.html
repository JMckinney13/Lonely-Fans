<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Creator Page – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <header class="dash-header">
    <div class="logo-row">
      <img src="assets/logo.jpg" alt="Lonely Fans" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </div>
    <div>
      <a href="index.html">Home</a>
    </div>
  </header>
  <main id="creatorPage" class="creator-page">
    <p>Loading creator...</p>
  </main>
  <script src="auth.js"></script>
  <script>
    const params = new URLSearchParams(window.location.search);
    const creatorId = params.get('id');
    const session = LonelyFansAuth.getSession();

      if (!creatorId) {
        document.getElementById('creatorPage').innerHTML = '<div class="empty-state">No creator specified.</div>';
      } else {
      (async () => {
        const page = document.getElementById('creatorPage');
        page.innerHTML = '<div class="empty-state">Loading creator...</div>';
        try {
          const profile = await LonelyFansAuth.getProfile(creatorId);
          if (!profile) {
            page.innerHTML = '<div class="empty-state">Creator not found.</div>';
            return;
          }
          const tiers = await LonelyFansAuth.getCreatorTiers(creatorId) || [];
          const subscribed = session && await LonelyFansAuth.isSubscribed(session.id, creatorId);

          page.style.setProperty('--theme', profile.themeColor || '#ff6b6b');
          page.style.setProperty('--accent', profile.accentColor || '#ff8e8e');

          let tiersHtml = tiers.length === 0 
            ? '<p class="note">No subscription tiers set yet.</p>'
            : tiers.map(t => `
              <div class="tier-card">
                <h3>${t.name}</h3>
                <div class="price">${t.price} SparkCoins / month</div>
                <ul>${(t.perks || []).map(p => `<li>${p}</li>`).join('')}</ul>
                ${subscribed ? '<button disabled>Subscribed</button>' : 
                  `<button onclick="doSubscribe('${t.id}', ${t.price})">Subscribe</button>`}
              </div>
            `).join('');

          page.innerHTML = `
            ${profile.bannerUrl ? `<div class="banner" style="background-image:url('${profile.bannerUrl}')"></div>` : ''}
            <div class="info-card">
              <h1>${profile.displayName || 'Creator'}</h1>
              <p>${profile.bio || 'No bio yet.'}</p>
              <div style="display:flex;gap:0.5rem;margin:0.8rem 0">
                <a href="live.html?id=${creatorId}" class="btn" style="width:auto">Watch Live</a>
                ${session && session.id !== creatorId ? `<button class="secondary" style="width:auto" onclick="doFollow()">${LonelyFansAuth.isFollowing(session.id, creatorId) ? 'Following' : 'Follow'}</button>` : ''}
              </div>
              <h2>Subscription Tiers</h2>
              <div class="tiers">${tiersHtml}</div>
            </div>
          `;
          document.title = (profile.displayName || 'Creator') + ' – Lonely Fans';
        } catch (err) {
          page.innerHTML = `<div class="empty-state">Failed to load creator: ${err.message}</div>`;
        }
      })();
      }

    function doFollow() {
      if (!session) { location.href = 'login.html'; return; }
      LonelyFansAuth.toggleFollow(session.id, creatorId);
      location.reload();
    }

    function doSubscribe(tierId, price) {
      if (!session) {
        location.href = 'login.html';
        return;
      }
      try {
        LonelyFansAuth.subscribe(session.id, creatorId, tierId, price);
        location.reload();
      } catch (err) {
        const page = document.getElementById('creatorPage');
        page.insertAdjacentHTML('beforeend', `<div class="message">${err.message}</div>`);
      }
    }
  </script>
</body>
</html>
