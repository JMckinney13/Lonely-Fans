<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Customize Your Page – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css?v=32520447">
</head>
<body>
  <header class="dash-header">
    <a href="index.html" class="logo-row">
      <img src="assets/logo.jpg" alt="" class="logo-img">
      <div class="logo">Lonely Fans</div>
    </a>
    <nav class="header-nav">
      <a href="dashboard.html">Dashboard</a>
      <button type="button" class="secondary" onclick="LonelyFansAuth.logout()">Logout</button>
    </nav>
  </header>
  <main class="container wide">
    <h1>Customize Your Creator Page</h1>
    <p class="note">Changes are saved to your account. The preview updates as you type.</p>

    <div class="editor-layout">
      <form id="profileForm" class="editor-form">
        <label>Display Name</label>
        <input type="text" id="displayName" required maxlength="40">

        <label>Bio</label>
        <textarea id="bio" rows="4" maxlength="500"></textarea>

        <label>Banner Image URL</label>
        <input type="url" id="bannerUrl" placeholder="https://example.com/banner.jpg">

        <label>Theme Color</label>
        <input type="color" id="themeColor" value="#ff4d8d">

        <label>Accent Color</label>
        <input type="color" id="accentColor" value="#ff8ab3">

        <label>Layout Style</label>
        <select id="layout">
          <option value="classic">Classic</option>
          <option value="minimal">Minimal</option>
          <option value="bold">Bold</option>
        </select>

        <label for="nextLiveAt">Going live at… (optional)</label>
        <div style="display:flex;gap:0.4rem;align-items:center">
          <input type="datetime-local" id="nextLiveAt" style="flex:1">
          <button type="button" class="secondary" id="clearLive" style="width:auto;margin:0">Clear</button>
        </div>
        <p class="note" style="margin-top:0.3rem">Shown on your page and browse card until that time (your local time zone).</p>

        <button type="submit" id="saveBtn" disabled>Loading…</button>
        <p id="saveStatus" class="message" role="status"></p>
      </form>

      <div class="preview-panel">
        <h3>Live Preview</h3>
        <div id="preview" class="creator-preview"></div>
        <p><a id="publicLink" href="#" target="_blank" rel="noopener">Open public page →</a></p>
      </div>
    </div>
  </main>
  <script src="auth.js?v=3ad7d4a1"></script>
  <script>
    const session = LonelyFansAuth.requireSession({ role: 'creator' });
    const esc = LonelyFansAuth.escapeHtml;
    const FIELDS = ['displayName', 'bio', 'bannerUrl', 'themeColor', 'accentColor', 'layout'];

    function readForm() {
      const data = {};
      FIELDS.forEach(id => data[id] = document.getElementById(id).value.trim());
      return data;
    }

    function safeUrl(url) {
      try {
        const u = new URL(url);
        return (u.protocol === 'https:' || u.protocol === 'http:') ? u.href : '';
      } catch { return ''; }
    }

    function renderPreview() {
      const data = readForm();
      const preview = document.getElementById('preview');
      preview.style.setProperty('--theme', data.themeColor);
      preview.style.setProperty('--accent', data.accentColor);
      preview.className = 'creator-preview layout-' + data.layout;
      const banner = safeUrl(data.bannerUrl);
      preview.innerHTML = `
        ${banner ? `<div class="banner" style="background-image:url('${esc(encodeURI(banner))}')"></div>` : '<div class="banner placeholder">Banner</div>'}
        <div class="info">
          <h2>${esc(data.displayName || 'Your Name')}</h2>
          <p>${esc(data.bio || 'Your bio appears here.')}</p>
        </div>
      `;
    }

    // datetime-local <-> ISO (UTC)
    function toLocalInput(iso) {
      const d = iso ? new Date(iso) : null;
      if (!d || isNaN(d)) return '';
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth() + 1)}-${pad(d.getDate())}T${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    document.getElementById('clearLive').addEventListener('click', () => { document.getElementById('nextLiveAt').value = ''; });

    if (session) {
      FIELDS.forEach(id => document.getElementById(id).addEventListener('input', renderPreview));
      document.getElementById('publicLink').href = 'creator.html?id=' + encodeURIComponent(session.id);
      renderPreview();

      (async () => {
        const btn = document.getElementById('saveBtn');
        const profile = await LonelyFansAuth.getProfile() || {};
        document.getElementById('displayName').value = profile.displayName || '';
        document.getElementById('bio').value = profile.bio || '';
        document.getElementById('bannerUrl').value = profile.bannerUrl || '';
        document.getElementById('themeColor').value = profile.themeColor || '#ff4d8d';
        document.getElementById('accentColor').value = profile.accentColor || '#ff8ab3';
        document.getElementById('layout').value = profile.layout || 'classic';
        document.getElementById('nextLiveAt').value = toLocalInput(profile.nextLiveAt);
        renderPreview();
        btn.disabled = false;
        btn.textContent = 'Save Changes';
      })();

      document.getElementById('profileForm').addEventListener('submit', async (e) => {
        e.preventDefault();
        const status = document.getElementById('saveStatus');
        const btn = document.getElementById('saveBtn');
        const data = readForm();
        if (!data.displayName) { status.className = 'message'; status.textContent = 'Display name is required.'; return; }
        const liveVal = document.getElementById('nextLiveAt').value;
        if (liveVal) {
          const d = new Date(liveVal);
          if (isNaN(d) || d <= new Date()) { status.className = 'message'; status.textContent = 'Pick a go-live time in the future.'; return; }
          data.nextLiveAt = d.toISOString();
        } else {
          data.nextLiveAt = null;
        }
        btn.disabled = true;
        btn.textContent = 'Saving…';
        try {
          await LonelyFansAuth.saveProfile(session.id, data);
          status.className = 'message success';
          status.textContent = 'Saved!';
          setTimeout(() => { if (status.textContent === 'Saved!') status.textContent = ''; }, 2500);
        } catch (err) {
          status.className = 'message';
          status.textContent = err.message;
        } finally {
          btn.disabled = false;
          btn.textContent = 'Save Changes';
        }
      });
    }
  </script>
</body>
</html>
