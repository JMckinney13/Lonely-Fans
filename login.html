<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login – Lonely Fans</title>
  <link rel="stylesheet" href="styles.css?v=32520447">
</head>
<body>
  <div class="container">
    <h1>Log In</h1>
    <form id="loginForm">
      <label>Email</label>
      <input type="email" id="email" required autocomplete="email">
      
      <label>Password</label>
      <input type="password" id="password" required autocomplete="current-password">
      
      <button type="submit" id="submitBtn">Log In</button>
    </form>
    <p>Don't have an account? <a href="register.html">Register</a></p>
    <p id="message" class="message" role="alert"></p>
  </div>
  <script src="auth.js?v=3ad7d4a1"></script>
  <script>
    // Already signed in? Skip the form.
    const existing = LonelyFansAuth.getSession();
    if (existing && localStorage.getItem('lonelyfans_token')) {
      location.replace(existing.ageVerified ? 'dashboard.html' : 'age-verify.html');
    }
    document.getElementById('loginForm').addEventListener('submit', async (e) => {
      e.preventDefault();
      const btn = document.getElementById('submitBtn');
      const msg = document.getElementById('message');
      btn.disabled = true;
      btn.textContent = 'Signing in...';
      msg.className = 'message';
      msg.textContent = '';
      setTimeout(() => { if (btn.disabled && !msg.textContent) msg.textContent = 'Waking up the server — this can take up to a minute on first load…'; }, 4000);
      try {
        const user = await LonelyFansAuth.login(
          document.getElementById('email').value.trim(),
          document.getElementById('password').value
        );
        location.href = user.ageVerified ? 'dashboard.html' : 'age-verify.html';
      } catch (err) {
        msg.className = 'message';
        msg.textContent = err.message;
        btn.disabled = false;
        btn.textContent = 'Log In';
      }
    });
  </script>
</body>
</html>
